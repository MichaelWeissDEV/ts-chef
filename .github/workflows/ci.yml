name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  ci:
    name: Lint, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Build extension
        run: npm run build

      - name: Resolve VSIX name
        id: vsix
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "name=vscode-ts-chef-${VERSION}.vsix" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        run: |
          npx --yes @vscode/vsce package \
            --no-dependencies \
            --out "${{ steps.vsix.outputs.name }}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.vsix.outputs.name }}
          retention-days: 14

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: test-report/
          retention-days: 14

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          echo "## CI Results" >> "$GITHUB_STEP_SUMMARY"
          echo "- **vsix** — installable extension package (\`${{ steps.vsix.outputs.name }}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **test-report** — HTML report of all test cases" >> "$GITHUB_STEP_SUMMARY"
          echo "- **coverage-report** — code coverage metrics" >> "$GITHUB_STEP_SUMMARY"
