name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  static-unit:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify:manifest
      - run: npm run lint:check
      - name: Typecheck production and tests
        run: npm run typecheck
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run test:harness

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-reports
          path: |
            test-report/
            coverage/
  security:
    name: Dependency security gate
    needs: static-unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: reports/v0.9.0-logs/audit*.json
  integration:
    name: VS Code host and real webview UI (${{ matrix.os }})
    needs: static-unit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Host integration (Linux)
        if: runner.os == 'Linux'
        env:
          TSCHEF_TEST_NO_SANDBOX: '1'
        run: xvfb-run -a npm run test:integration
      - name: UI interaction (Linux)
        if: runner.os == 'Linux'
        env:
          TSCHEF_TEST_NO_SANDBOX: '1'
        run: xvfb-run -a npm run test:ui
      - name: Host integration (macOS)
        if: runner.os == 'macOS'
        run: npm run test:integration
      - name: UI interaction (macOS)
        if: runner.os == 'macOS'
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-${{ matrix.os }}
          path: |
            reports/test-results/
            reports/v0.9.0-logs/
  package:
    name: Documentation, verified VSIX and installed tests
    needs: [static-unit, integration, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: npm ci
      - run: python -m pip install -r docs/requirements.txt
      - name: Run the same complete local release gates
        env:
          TSCHEF_TEST_NO_SANDBOX: '1'
        run: xvfb-run -a npm run release:verify
      - name: Catalog must be committed
        run: git diff --exit-code -- docs/operation-catalog.md
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-artifacts
          path: |
            vscode-ts-chef-*.vsix
            ts-chef-docs-*.zip
            release-artifacts.json
            release-notes.md
            SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-evidence
          path: |
            reports/test-results/
            reports/v0.9.0-logs/
  readiness:
    name: Require every release gate
    if: always()
    needs: [static-unit, integration, security, package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/release-policy.cjs
        env:
          TSCHEF_GATE_RESULTS: ${{ toJSON(needs) }}
