name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Validate immutable tag and package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/verify-manifest.cjs --tag
  gates:
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    name: Publish only verified tag artifacts
    needs: [validate, gates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-artifacts
          path: release-artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ts-chef ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release-artifacts/vscode-ts-chef-*.vsix
            release-artifacts/ts-chef-docs-*.zip
